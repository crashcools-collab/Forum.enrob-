# Services d'appui. LM Studio et l'application tournent sur l'hôte (voir README).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: agents
      POSTGRES_DB: agents
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30"]
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents"]
      interval: 10s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      # Écoute en IPv4 : évite un plantage au démarrage sur les machines sans IPv6.
      GRANIAN_HOST: 0.0.0.0
    mem_limit: 384m
    restart: unless-stopped

volumes:
  pgdata:
