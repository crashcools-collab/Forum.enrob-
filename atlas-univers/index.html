<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03050c">
<title>Atlas de l'Univers</title>
<meta name="description" content="Le ciel réel en direct, le système solaire et l'univers en 3D, les photos et vidéos de la NASA, des démonstrations, des quiz et Stella, la fée des étoiles.">
<style>:root {
  --fond: #03050c;
  --fond-2: #080d1c;
  --carte: #0d1428;
  --carte-2: #131c36;
  --bord: #24305a;
  --texte: #e8ecf8;
  --texte-2: #a9b3d1;
  --texte-3: #6f7aa0;
  --accent: #8ab4ff;
  --accent-2: #c79bff;
  --or: #ffd27a;
  --rose: #ff8fc8;
  --vert: #7be0a6;
  --rouge: #ff7a7a;
  --ombre: 0 10px 40px rgba(0, 0, 0, .45);
  --rayon: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--fond);
  color: var(--texte);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { line-height: 1.2; margin: 0 0 .5em; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.15rem; }
p { margin: 0 0 .8em; }

/* Structure */
.appli { display: grid; grid-template-rows: auto 1fr; height: 100vh; height: 100dvh; }
.entete {
  display: flex; align-items: center; gap: 14px; padding: 8px 14px;
  background: linear-gradient(180deg, #0a1022, #060a16);
  border-bottom: 1px solid var(--bord); min-width: 0;
}
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; letter-spacing: .02em; }
.logo svg { width: 28px; height: 28px; }
.onglets { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.onglets::-webkit-scrollbar { display: none; }
.onglet {
  border: 1px solid transparent; background: none; padding: 7px 11px; border-radius: 999px;
  color: var(--texte-2); white-space: nowrap; font-size: .9rem;
}
.onglet:hover { color: var(--texte); background: var(--carte); }
.onglet.actif { color: #fff; background: var(--carte-2); border-color: var(--bord); }
.bouton-icone {
  border: 1px solid var(--bord); background: var(--carte); border-radius: 10px; padding: 6px 10px; white-space: nowrap;
}
.bouton-icone[aria-pressed="true"] { background: #3a0d12; border-color: #a33; }
main { position: relative; min-height: 0; }
.vue { position: absolute; inset: 0; display: none; }
.vue.active { display: block; }
.defile { overflow-y: auto; height: 100%; padding: 22px 18px 120px; }
.contenu { max-width: 1100px; margin: 0 auto; }
.intro { color: var(--texte-2); max-width: 760px; }

/* Boutons et champs */
.btn {
  border: 1px solid var(--bord); background: var(--carte-2); padding: 7px 12px; border-radius: 10px;
  transition: background .15s, border-color .15s;
}
.btn:hover { border-color: var(--accent); }
.btn.primaire { background: linear-gradient(135deg, #3d5fd6, #7b4fd8); border-color: transparent; color: #fff; }
.btn.petit { padding: 4px 9px; font-size: .85rem; }
.btn[aria-pressed="true"] { background: #23366e; border-color: var(--accent); }
input[type=text], input[type=number], input[type=search], input[type=datetime-local], select, textarea {
  background: var(--fond-2); border: 1px solid var(--bord); border-radius: 10px; padding: 7px 10px; min-width: 0;
}
input:focus-visible, select:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ligne { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pastille { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--carte-2); border: 1px solid var(--bord); font-size: .8rem; color: var(--texte-2); }

/* Cartes */
.grille { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.carte {
  background: linear-gradient(180deg, var(--carte), #0a1022); border: 1px solid var(--bord); border-radius: var(--rayon);
  padding: 16px; min-width: 0;
}
.carte h3 { margin-bottom: .35em; }
.carte .meta { color: var(--texte-3); font-size: .82rem; margin-bottom: .5em; }
.carte.cliquable { cursor: pointer; transition: transform .15s, border-color .15s; }
.carte.cliquable:hover { transform: translateY(-2px); border-color: var(--accent); }
.chiffre { font-size: 1.6rem; font-weight: 700; color: var(--or); line-height: 1.1; }
.section { margin: 28px 0 10px; }

/* Planétarium */
.ciel-zone { position: absolute; inset: 0; touch-action: none; cursor: grab; }
.ciel-zone:active { cursor: grabbing; }
.ciel-zone canvas { display: block; width: 100%; height: 100%; }
.barre-ciel {
  position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  background: rgba(6, 10, 22, .82); border: 1px solid var(--bord); border-radius: 14px; padding: 8px; backdrop-filter: blur(8px);
}
.barre-ciel .sep { width: 1px; height: 24px; background: var(--bord); }
.haut-ciel { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
.haut-ciel > * { pointer-events: auto; }
.infos-ciel {
  background: rgba(6, 10, 22, .78); border: 1px solid var(--bord); border-radius: 12px; padding: 6px 10px; font-size: .85rem; color: var(--texte-2);
}
.infos-ciel b { color: var(--texte); }
.recherche-ciel { position: relative; }
.recherche-ciel input { width: 230px; background: rgba(6, 10, 22, .85); }
.suggestions {
  position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: var(--carte); border: 1px solid var(--bord);
  border-radius: 10px; max-height: 280px; overflow-y: auto; z-index: 5; box-shadow: var(--ombre);
}
.suggestions button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; }
.suggestions button:hover, .suggestions button.sel { background: var(--carte-2); }
.fiche-astre {
  position: absolute; right: 10px; top: 56px; width: min(340px, calc(100% - 20px)); max-height: calc(100% - 150px); overflow-y: auto;
  background: rgba(10, 16, 34, .94); border: 1px solid var(--bord); border-radius: 14px; padding: 14px; box-shadow: var(--ombre);
  backdrop-filter: blur(8px); z-index: 4;
}
.fiche-astre[hidden] { display: none; }
.fiche-astre table { width: 100%; border-collapse: collapse; font-size: .88rem; margin: 6px 0 10px; }
.fiche-astre td { padding: 3px 0; border-bottom: 1px solid #1a2446; vertical-align: top; }
.fiche-astre td:first-child { color: var(--texte-3); width: 42%; }
.fermer { float: right; border: 0; background: none; font-size: 1.3rem; line-height: 1; color: var(--texte-2); }
.panneau-options {
  position: absolute; left: 10px; bottom: 64px; width: min(340px, calc(100% - 20px)); background: rgba(10, 16, 34, .96);
  border: 1px solid var(--bord); border-radius: 14px; padding: 14px; z-index: 4; max-height: calc(100% - 140px); overflow-y: auto;
}
.panneau-options[hidden] { display: none; }
.panneau-options label { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
.panneau-options h4 { margin: 10px 0 6px; color: var(--texte-2); font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; }

/* Vues 3D */
.scene { position: absolute; inset: 0; touch-action: none; cursor: grab; }
.scene canvas { display: block; width: 100%; height: 100%; }
.legende-3d {
  position: absolute; left: 10px; top: 10px; width: min(360px, calc(100% - 20px)); background: rgba(6, 10, 22, .82);
  border: 1px solid var(--bord); border-radius: 14px; padding: 12px 14px; backdrop-filter: blur(8px); max-height: calc(100% - 90px); overflow-y: auto;
}
.legende-3d p { font-size: .9rem; color: var(--texte-2); }
.legende-3d.reduite .corps { display: none; }

/* Médias */
.medias { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.media { background: var(--carte); border: 1px solid var(--bord); border-radius: 12px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; }
.media img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: #000; }
.media .titre-media { padding: 8px 10px; font-size: .85rem; }
.media .type-media { font-size: .72rem; color: var(--or); text-transform: uppercase; letter-spacing: .06em; }
.visionneuse {
  position: fixed; inset: 0; background: rgba(0, 0, 0, .9); z-index: 50; display: grid; place-items: center; padding: 16px;
}
.visionneuse[hidden] { display: none; }
.visionneuse .boite { max-width: min(1100px, 100%); max-height: 100%; overflow-y: auto; background: var(--carte); border: 1px solid var(--bord); border-radius: 14px; padding: 14px; }
.visionneuse img, .visionneuse video { max-width: 100%; max-height: 70vh; display: block; margin: 0 auto 10px; border-radius: 8px; }
.apod { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; }
.apod img, .apod iframe { width: 100%; border-radius: 12px; border: 1px solid var(--bord); }
@media (max-width: 760px) { .apod { grid-template-columns: 1fr; } }

/* Encyclopédie */
.encyclo { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; }
.encyclo nav { position: sticky; top: 0; align-self: start; max-height: calc(100vh - 120px); overflow-y: auto; }
.encyclo nav h4 { margin: 14px 0 4px; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--texte-3); }
.encyclo nav button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 4px 8px; border-radius: 8px; color: var(--texte-2); }
.encyclo nav button:hover, .encyclo nav button.actif { background: var(--carte-2); color: var(--texte); }
.article { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 22px; }
.article .schema { margin: 14px 0; background: var(--fond-2); border: 1px solid var(--bord); border-radius: 12px; padding: 10px; }
.article .schema svg { width: 100%; height: auto; display: block; }
.article ul { padding-left: 1.2em; }
.chiffres-cles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 12px 0; }
.chiffres-cles div { background: var(--fond-2); border: 1px solid var(--bord); border-radius: 10px; padding: 8px 10px; }
.chiffres-cles b { display: block; color: var(--or); }
.chiffres-cles span { font-size: .8rem; color: var(--texte-3); }
@media (max-width: 820px) {
  .encyclo { grid-template-columns: 1fr; }
  .encyclo nav { position: static; max-height: 220px; border: 1px solid var(--bord); border-radius: 12px; padding: 6px; }
}

/* Démonstrations */
.demo { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.demo canvas { width: 100%; aspect-ratio: 16/10; background: #02040a; border: 1px solid var(--bord); border-radius: 12px; display: block; }
.demo input[type=range] { width: 100%; }
@media (max-width: 820px) { .demo { grid-template-columns: 1fr; } }

/* Quiz */
.quiz-question { font-size: 1.15rem; font-weight: 600; margin: 8px 0 14px; }
.reponses { display: grid; gap: 8px; }
.reponses button { text-align: left; border: 1px solid var(--bord); background: var(--carte-2); border-radius: 10px; padding: 10px 12px; }
.reponses button.bonne { background: #0f3a27; border-color: var(--vert); }
.reponses button.fausse { background: #3a1216; border-color: var(--rouge); }
.explication { margin-top: 12px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--fond-2); border-radius: 0 10px 10px 0; color: var(--texte-2); }
.progression { height: 6px; background: var(--fond-2); border-radius: 99px; overflow: hidden; margin: 8px 0; }
.progression div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s; }
.constel-canvas { width: 100%; max-width: 420px; aspect-ratio: 1; background: #02040a; border-radius: 12px; border: 1px solid var(--bord); display: block; margin: 0 auto 12px; }

/* Défis */
.defi { display: flex; gap: 12px; align-items: flex-start; }
.defi input { width: 22px; height: 22px; margin-top: 3px; accent-color: #7b4fd8; flex: none; }
.defi.fait h3 { text-decoration: line-through; color: var(--texte-3); }
.badges { display: flex; gap: 10px; flex-wrap: wrap; }
.badge { padding: 8px 12px; border-radius: 12px; border: 1px dashed var(--bord); color: var(--texte-3); }
.badge.gagne { border-style: solid; border-color: var(--or); color: var(--or); background: #2a2210; }

/* Tableaux */
.tableau { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tableau th, .tableau td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--bord); vertical-align: top; }
.tableau th { color: var(--texte-3); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
.defile-x { overflow-x: auto; }

/* Fée Stella */
.fee {
  position: fixed; right: 18px; bottom: 18px; width: 74px; height: 74px; z-index: 40; border: 0; background: none; padding: 0;
  transition: left 1.2s cubic-bezier(.5, 0, .2, 1), top 1.2s cubic-bezier(.5, 0, .2, 1), right 1.2s, bottom 1.2s;
  filter: drop-shadow(0 0 14px rgba(255, 170, 240, .55));
}
.fee svg { width: 100%; height: 100%; overflow: visible; }
.fee .ailes { transform-origin: 50px 48px; animation: battre .35s ease-in-out infinite alternate; }
.fee .corps-fee { animation: flotter 2.6s ease-in-out infinite; }
@keyframes battre { from { transform: scaleX(1); } to { transform: scaleX(.55); } }
@keyframes flotter { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.paillette { position: fixed; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; z-index: 39; background: #fff6c8; box-shadow: 0 0 8px #ffd27a; animation: paillette 1s ease-out forwards; }
@keyframes paillette { to { transform: translateY(26px) scale(.2); opacity: 0; } }
.bulle-fee {
  position: fixed; right: 18px; bottom: 100px; width: min(400px, calc(100vw - 36px)); max-height: min(620px, calc(100dvh - 140px));
  display: flex; flex-direction: column; background: rgba(12, 16, 36, .97); border: 1px solid #5a3f8a; border-radius: 18px;
  box-shadow: 0 0 0 1px rgba(199, 155, 255, .15), var(--ombre); z-index: 41; overflow: hidden;
}
.bulle-fee[hidden] { display: none; }
.bulle-fee header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: linear-gradient(135deg, #2a1d52, #14193a); }
.bulle-fee header b { flex: 1; }
.fil { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 92%; padding: 9px 12px; border-radius: 14px; font-size: .92rem; }
.msg.fee-msg { background: #1d1840; border: 1px solid #3c2f72; align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.moi { background: #1f3a78; align-self: flex-end; border-bottom-right-radius: 4px; }
.msg .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.saisie-fee { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--bord); flex: none; }
.saisie-fee input { flex: 1; }
.suggestions-fee { display: flex; gap: 6px; overflow-x: auto; padding: 0 10px 8px; flex: none; }
.suggestions-fee button { white-space: nowrap; }
.visite {
  position: fixed; z-index: 42; left: 50%; bottom: 110px; transform: translateX(-50%); width: min(520px, calc(100vw - 32px));
  background: rgba(20, 14, 44, .97); border: 1px solid #7b5fc0; border-radius: 16px; padding: 14px 16px; box-shadow: var(--ombre);
}
.visite[hidden] { display: none; }

/* Formation « L'Odyssée cosmique » */
.odyssee-hero {
  background: radial-gradient(ellipse at 80% 0%, #3a2470 0%, transparent 60%), linear-gradient(180deg, #121a3a, #0a1022);
  border: 1px solid #4a3a80; border-radius: 18px; padding: 22px; margin-bottom: 18px;
}
.odyssee-hero h2 { font-size: 2rem; }
.odyssee-chemin { display: grid; gap: 10px; position: relative; }
.etape-odyssee {
  display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; text-align: left;
  background: var(--carte); border: 1px solid var(--bord); border-radius: 14px; padding: 12px 14px;
}
.etape-odyssee:hover:not(:disabled) { border-color: var(--accent); }
.etape-odyssee:disabled { opacity: .45; cursor: not-allowed; }
.etape-odyssee.faite { border-color: #2f6b4c; }
.etape-odyssee.courante { border-color: var(--or); box-shadow: 0 0 0 1px rgba(255, 210, 122, .25); }
.icone-etape { font-size: 1.8rem; text-align: center; }
.statut-etape { font-size: 1.2rem; }
.scene-odyssee { max-width: 780px; margin: 14px auto 0; }
.scene-odyssee h2 { font-size: 1.7rem; margin-top: 10px; }
.recit { font-size: 1.08rem; line-height: 1.7; }
.recit p { margin-bottom: 1em; }
.rebondissement { margin: 18px 0; padding: 14px 16px; border-radius: 14px; border: 1px dashed #7b5fc0; background: #160f33; }
.rebondissement.revele { border-style: solid; box-shadow: 0 0 30px rgba(155, 107, 255, .25); animation: apparaitre .4s ease-out; }
.rebondissement h3 { color: #d9c2ff; }
.question-odyssee { margin: 18px 0; }
.nav-odyssee { justify-content: space-between; margin: 22px 0 10px; }
.diplome { width: 100%; height: auto; border-radius: 10px; margin: 12px 0; border: 1px solid var(--bord); display: block; }
#retour-formation { position: fixed; left: 16px; bottom: 76px; z-index: 39; box-shadow: var(--ombre); }
#zone-impression { display: none; }
@media print {
  body > *:not(#zone-impression) { display: none !important; }
  #zone-impression { display: block !important; }
  #zone-impression img { width: 100%; }
  body { background: #fff; overflow: visible; }
}

/* Petite astuce de Stella près de la fée */
.astuce-fee {
  position: fixed; right: 100px; bottom: 40px; max-width: min(300px, calc(100vw - 130px)); z-index: 40; background: #1d1840; border: 1px solid #5a3f8a;
  border-radius: 14px 14px 4px 14px; padding: 9px 12px; font-size: .88rem; box-shadow: var(--ombre); animation: apparaitre .3s ease-out;
}
.astuce-fee[hidden] { display: none; }
@keyframes apparaitre { from { opacity: 0; transform: translateY(8px); } }
@media (max-width: 640px) { .astuce-fee { right: 76px; bottom: 96px; } }

/* Mode nuit rouge : préserve la vision nocturne des astronomes */
.filtre-rouge { position: fixed; inset: 0; background: #ff0000; mix-blend-mode: multiply; pointer-events: none; z-index: 100; display: none; }
body.nuit-rouge .filtre-rouge { display: block; }

.cache { display: none !important; }
.texte-2 { color: var(--texte-2); }
.petit { font-size: .85rem; }
@media (max-width: 640px) {
  body { font-size: 14px; }
  .logo span { display: none; }
  .recherche-ciel input { width: 160px; }
  .fee { width: 60px; height: 60px; right: 10px; bottom: 76px; }
  .bulle-fee { right: 10px; bottom: 140px; }
}
@media (prefers-reduced-motion: reduce) {
  .fee .ailes, .fee .corps-fee { animation: none; }
  .fee { transition: none; }
}
</style>
</head>
<body>
<div class="filtre-rouge" aria-hidden="true"></div>
<div class="appli">
  <header class="entete">
    <div class="logo">
      <svg viewBox="0 0 32 32" aria-hidden="true"><defs><radialGradient id="lg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#ffd27a"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient></defs><circle cx="16" cy="16" r="15" fill="url(#lg)" opacity=".5"/><ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="#8ab4ff" stroke-width="1.4" transform="rotate(-25 16 16)"/><circle cx="16" cy="16" r="4.5" fill="#ffe7a8"/></svg>
      <span>Atlas de l'Univers</span>
    </div>
    <nav class="onglets" role="tablist" aria-label="Sections">
      <button class="onglet actif" data-vue="ciel" role="tab">🌌 Ciel en direct</button>
      <button class="onglet" data-vue="cesoir" role="tab">🔭 Ce soir</button>
      <button class="onglet" data-vue="formation" role="tab">🎓 Formation</button>
      <button class="onglet" data-vue="systeme" role="tab">🪐 Système solaire 3D</button>
      <button class="onglet" data-vue="cosmos" role="tab">🌀 Univers 3D</button>
      <button class="onglet" data-vue="medias" role="tab">📷 Photos et vidéos NASA</button>
      <button class="onglet" data-vue="decouvertes" role="tab">✨ Découvertes</button>
      <button class="onglet" data-vue="demos" role="tab">🧪 Démonstrations</button>
      <button class="onglet" data-vue="encyclo" role="tab">📚 Encyclopédie</button>
      <button class="onglet" data-vue="quiz" role="tab">🧠 Quiz</button>
      <button class="onglet" data-vue="defis" role="tab">🏅 Défis</button>
      <button class="onglet" data-vue="outils" role="tab">🧮 Outils et calendrier</button>
    </nav>
    <button class="bouton-icone" id="btn-rouge" aria-pressed="false" title="Lumière rouge : garde ta vision de nuit pendant l'observation">🔴 Nuit</button>
  </header>

  <main>
    <!-- Planétarium -->

// Indice de couleur B-V -> couleur RVB (température via la formule de Ballesteros)
function couleurEtoile(bv) {
  bv = Math.max(-0.4, Math.min(2.0, bv));
  const T = 4600 * (1 / (0.92 * bv + 1.7) + 1 / (0.92 * bv + 0.62));
  const t = T / 100;
  let r, g, b;
  if (t <= 66) { r = 255; g = 99.47 * Math.log(t) - 161.12; b = t <= 19 ? 0 : 138.52 * Math.log(t - 10) - 305.04; }
  else { r = 329.7 * Math.pow(t - 60, -0.1332); g = 288.12 * Math.pow(t - 60, -0.0755); b = 255; }
  const c = v => Math.round(Math.max(0, Math.min(255, v)) * 0.65 + 255 * 0.35); // un peu pâli, comme à l'œil
  return { rgb: `rgb(${c(r)},${c(g)},${c(b)})`, temperature: Math.round(T) };
}

// Canvas net sur écran haute densité
function ajusterCanvas(canvas) {
  const r = canvas.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: r.width, h: r.height };
}

// Sprite de halo doux réutilisable
function creerHalo(couleurCentre, taille = 64) {
  const c = document.createElement('canvas'); c.width = c.height = taille;
  const g = c.getContext('2d'), gr = g.createRadialGradient(taille / 2, taille / 2, 0, taille / 2, taille / 2, taille / 2);
  gr.addColorStop(0, couleurCentre); gr.addColorStop(0.25, couleurCentre.replace(/[\d.]+\)$/, '0.35)')); gr.addColorStop(1, 'rgba(0,0,0,0)');

}

// Glisser / zoomer à la souris, au doigt et à la molette, sur n'importe quelle scène
function gestesScene(el, { glisser, zoomer, cliquer }) {
  const pointeurs = new Map();
  let distPince = 0, bouge = 0, depart = null;
  el.addEventListener('pointerdown', e => {
    el.setPointerCapture(e.pointerId); pointeurs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    bouge = 0; depart = { x: e.clientX, y: e.clientY };
    if (pointeurs.size === 2) { const [a, b] = [...pointeurs.values()]; distPince = Math.hypot(a.x - b.x, a.y - b.y); }
  });
  el.addEventListener('pointermove', e => {
    if (!pointeurs.has(e.pointerId)) return;
    const p = pointeurs.get(e.pointerId), dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pointeurs.size === 1) { bouge += Math.abs(dx) + Math.abs(dy); glisser(dx, dy); }
    else if (pointeurs.size === 2) {
      const [a, b] = [...pointeurs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (distPince) zoomer(distPince / d); distPince = d; bouge = 99;
    }
  });
  const fin = e => {
    if (pointeurs.has(e.pointerId) && pointeurs.size === 1 && bouge < 6 && cliquer) {
      const r = el.getBoundingClientRect(); cliquer(depart.x - r.left, depart.y - r.top);
    }
    pointeurs.delete(e.pointerId); if (pointeurs.size < 2) distPince = 0;
  };
  el.addEventListener('pointerup', fin);
  el.addEventListener('pointercancel', e => { pointeurs.delete(e.pointerId); });
  el.addEventListener('wheel', e => { e.preventDefault(); zoomer(Math.exp(e.deltaY * 0.0012)); }, { passive: false });
}

// ===== astro.js =====
// Moteur astronomique : temps sidéral, précession, planètes (éléments de Kepler JPL), Lune, Soleil,
// passage en coordonnées horizontales. Précision visée : quelques minutes d'arc (largement assez pour l'œil).
const Astro = (() => {
  const RAD = Math.PI / 180, DEG = 180 / Math.PI;
  const OBLIQUITE = 23.43928 * RAD;
  const norm360 = a => ((a % 360) + 360) % 360;

  const jourJulien = date => date.getTime() / 86400000 + 2440587.5;
  const siecles = jd => (jd - 2451545.0) / 36525;

  // Temps sidéral moyen de Greenwich (degrés)
  function tsmg(jd) {
    const d = jd - 2451545.0, T = d / 36525;
    return norm360(280.46061837 + 360.98564736629 * d + 0.000387933 * T * T);
  }

  // Matrice de précession J2000 -> équinoxe de la date (IAU 1976)
  function matricePrecession(jd) {
    const T = siecles(jd);
    const zeta = (2306.2181 * T + 0.30188 * T * T + 0.017998 * T * T * T) / 3600 * RAD;
    const z = (2306.2181 * T + 1.09468 * T * T + 0.018203 * T * T * T) / 3600 * RAD;
    const th = (2004.3109 * T - 0.42665 * T * T - 0.041833 * T * T * T) / 3600 * RAD;
    const cz = Math.cos(zeta), sz = Math.sin(zeta), cZ = Math.cos(z), sZ = Math.sin(z), ct = Math.cos(th), st = Math.sin(th);
    return [
      [cz * ct * cZ - sz * sZ, -sz * ct * cZ - cz * sZ, -st * cZ],
      [cz * ct * sZ + sz * cZ, -sz * ct * sZ + cz * cZ, -st * sZ],
      [cz * st, -sz * st, ct]
    ];
  }
  const mulMat = (A, B) => A.map(l => [0, 1, 2].map(j => l[0] * B[0][j] + l[1] * B[1][j] + l[2] * B[2][j]));
  const mulVec = (M, v) => [M[0][0] * v[0] + M[0][1] * v[1] + M[0][2] * v[2], M[1][0] * v[0] + M[1][1] * v[1] + M[1][2] * v[2], M[2][0] * v[0] + M[2][1] * v[1] + M[2][2] * v[2]];

  // Matrice J2000 équatorial -> horizontal (Nord, Est, Zénith) pour un lieu et un instant
  function matriceHorizon(jd, latDeg, lonDeg) {
    const lst = (tsmg(jd) + lonDeg) * RAD, phi = latDeg * RAD;
    const c = Math.cos(lst), s = Math.sin(lst), sp = Math.sin(phi), cp = Math.cos(phi);
    // rotation de -TSL autour de l'axe polaire, puis bascule vers l'horizon
    const rot = [[c, s, 0], [-s, c, 0], [0, 0, 1]]; // (x', y', z') avec y' vers l'est
    const hor = [[-sp, 0, cp], [0, 1, 0], [cp, 0, sp]];
    return mulMat(mulMat(hor, rot), matricePrecession(jd));
  }

  const versVecteur = (raDeg, decDeg) => {
    const a = raDeg * RAD, d = decDeg * RAD;
    return [Math.cos(d) * Math.cos(a), Math.cos(d) * Math.sin(a), Math.sin(d)];
  };
  const versRaDec = v => {
    const r = Math.hypot(v[0], v[1], v[2]);
    return { ra: norm360(Math.atan2(v[1], v[0]) * DEG), dec: Math.asin(v[2] / r) * DEG };
  };
  const versAltAz = h => ({ alt: Math.asin(Math.max(-1, Math.min(1, h[2] / Math.hypot(h[0], h[1], h[2])))) * DEG, az: norm360(Math.atan2(h[1], h[0]) * DEG) });
  const eclVersEq = v => {
    const c = Math.cos(OBLIQUITE), s = Math.sin(OBLIQUITE);
    return [v[0], v[1] * c - v[2] * s, v[1] * s + v[2] * c];
  };

  // Éléments orbitaux JPL (Standish), valables 1800-2050 : a, e, I, L, ϖ, Ω et leurs dérivées par siècle
  const ELEMENTS = {
    mercure: [0.38709927, 0.20563593, 7.00497902, 252.25032350, 77.45779628, 48.33076593, 0.00000037, 0.00001906, -0.00594749, 149472.67411175, 0.16047689, -0.12534081],
    venus: [0.72333566, 0.00677672, 3.39467605, 181.97909950, 131.60246718, 76.67984255, 0.00000390, -0.00004107, -0.00078890, 58517.81538729, 0.00268329, -0.27769418],
    terre: [1.00000261, 0.01671123, -0.00001531, 100.46457166, 102.93768193, 0.0, 0.00000562, -0.00004392, -0.01294668, 35999.37244981, 0.32327364, 0.0],
    mars: [1.52371034, 0.09339410, 1.84969142, -4.55343205, -23.94362959, 49.55953891, 0.00001847, 0.00007882, -0.00813131, 19140.30268499, 0.44441088, -0.29257343],
    jupiter: [5.20288700, 0.04838624, 1.30439695, 34.39644051, 14.72847983, 100.47390909, -0.00011607, -0.00013253, -0.00183714, 3034.74612775, 0.21252668, 0.20469106],
    saturne: [9.53667594, 0.05386179, 2.48599187, 49.95424423, 92.59887831, 113.66242448, -0.00125060, -0.00050991, 0.00193609, 1222.49362201, -0.41897216, -0.28867794],
    uranus: [19.18916464, 0.04725744, 0.77263783, 313.23810451, 170.95427630, 74.01692503, -0.00196176, -0.00004397, -0.00242939, 428.48202785, 0.40805281, 0.04240589],
    neptune: [30.06992276, 0.00859048, 1.77004347, -55.12002969, 44.96476227, 131.78422574, 0.00026291, 0.00005105, 0.00035372, 218.45945325, -0.32241464, -0.00508664],
    pluton: [39.48211675, 0.24882730, 17.14001206, 238.92903833, 224.06891629, 110.30393684, -0.00031596, 0.00005170, 0.00004818, 145.20780515, -0.04062942, -0.01183482]
  };

  function kepler(M, e) {
    let E = M + e * Math.sin(M);
    for (let i = 0; i < 8; i++) E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
    return E;
  }

  // Position héliocentrique écliptique J2000 (UA) à partir d'éléments (a, e, i, Ω, ω, M en degrés)
  function positionOrbite(a, e, iDeg, OmDeg, omDeg, Mdeg) {
    const E = kepler(norm360(Mdeg) * RAD, e);
    const xp = a * (Math.cos(E) - e), yp = a * Math.sqrt(1 - e * e) * Math.sin(E);
    const om = omDeg * RAD, Om = OmDeg * RAD, i = iDeg * RAD;
    const co = Math.cos(om), so = Math.sin(om), cO = Math.cos(Om), sO = Math.sin(Om), ci = Math.cos(i), si = Math.sin(i);
    return [
      (co * cO - so * sO * ci) * xp + (-so * cO - co * sO * ci) * yp,
      (co * sO + so * cO * ci) * xp + (-so * sO + co * cO * ci) * yp,
      (so * si) * xp + (co * si) * yp
    ];
  }

  function elementsPlanete(nom, jd) {
    const p = ELEMENTS[nom], T = siecles(jd);
    const a = p[0] + p[6] * T, e = p[1] + p[7] * T, I = p[2] + p[8] * T, L = p[3] + p[9] * T, w = p[4] + p[10] * T, O = p[5] + p[11] * T;
    return { a, e, i: I, Om: O, om: w - O, M: L - w };
  }
  function helio(nom, jd) {
    const el = elementsPlanete(nom, jd);
    return positionOrbite(el.a, el.e, el.i, el.Om, el.om, el.M);
  }

  // Comète de Halley (passage au périhélie le 9 février 1986)
  const HALLEY = { a: 17.834, e: 0.96714, i: 162.26, Om: 58.42, om: 111.33, tp: 2446470.5 };
  function helioHalley(jd) {
    const n = 0.9856076686 / Math.pow(HALLEY.a, 1.5);
    return positionOrbite(HALLEY.a, HALLEY.e, HALLEY.i, HALLEY.Om, HALLEY.om, n * (jd - HALLEY.tp));
  }

  // Lune géocentrique (écliptique de la date, km) – série courte, précision ~0,2°
  function lune(jd) {
    const d = jd - 2451545.0;
    const Lp = 218.316 + 13.176396 * d, Mp = (134.963 + 13.064993 * d) * RAD, F = (93.272 + 13.229350 * d) * RAD;
    const D = (297.850 + 12.190749 * d) * RAD, Ms = (357.529 + 0.98560028 * d) * RAD;
    const lon = Lp + 6.289 * Math.sin(Mp) - 1.274 * Math.sin(Mp - 2 * D) + 0.658 * Math.sin(2 * D) - 0.186 * Math.sin(Ms)
      - 0.059 * Math.sin(2 * Mp - 2 * D) - 0.057 * Math.sin(Mp - 2 * D + Ms) + 0.053 * Math.sin(Mp + 2 * D)
      + 0.046 * Math.sin(2 * D - Ms) + 0.041 * Math.sin(Mp - Ms) - 0.035 * Math.sin(D) - 0.031 * Math.sin(Mp + Ms)
      - 0.015 * Math.sin(2 * F - 2 * D) + 0.011 * Math.sin(Mp - 4 * D);
    const lat = 5.128 * Math.sin(F) + 0.2806 * Math.sin(Mp + F) + 0.2777 * Math.sin(Mp - F) + 0.1732 * Math.sin(2 * D - F);
    const dist = 385001 - 20905 * Math.cos(Mp) - 3699 * Math.cos(2 * D - Mp) - 2956 * Math.cos(2 * D);
    // La série donne des coordonnées de la date : on les ramène à J2000 (précession en longitude)
    const lonJ2000 = lon - 1.3970 * siecles(jd);
    const l = lonJ2000 * RAD, b = lat * RAD;
    return { ecl: [dist * Math.cos(b) * Math.cos(l), dist * Math.cos(b) * Math.sin(l), dist * Math.sin(b)], dist };
  }

  const PLANETES = [
    { id: 'mercure', nom: 'Mercure', rayon: 2440, couleur: '#b9b2a8' },
    { id: 'venus', nom: 'Vénus', rayon: 6052, couleur: '#f3e2b5' },
    { id: 'mars', nom: 'Mars', rayon: 3390, couleur: '#e0795a' },
    { id: 'jupiter', nom: 'Jupiter', rayon: 69911, couleur: '#e7caa0' },
    { id: 'saturne', nom: 'Saturne', rayon: 58232, couleur: '#ead9a6' },
    { id: 'uranus', nom: 'Uranus', rayon: 25362, couleur: '#a8dde6' },
    { id: 'neptune', nom: 'Neptune', rayon: 24622, couleur: '#6f8fe8' }
  ];

  // Magnitudes apparentes (formules de Mallama et Hilton 2018, simplifiées ; anneaux de Saturne ignorés)
  function magnitude(id, r, delta, i) {
    const base = 5 * Math.log10(r * delta);
    switch (id) {
      case 'mercure': return base - 0.613 + 6.328e-2 * i - 1.6336e-3 * i ** 2 + 3.3644e-5 * i ** 3 - 3.4265e-7 * i ** 4 + 1.6893e-9 * i ** 5 - 3.0334e-12 * i ** 6;
      case 'venus': return i < 163.7 ? base - 4.384 - 1.044e-3 * i + 3.687e-4 * i ** 2 - 2.814e-6 * i ** 3 + 8.938e-9 * i ** 4 : base + 236.05828 - 2.81914 * i + 8.39034e-3 * i ** 2;
      case 'mars': return base - 1.601 + 0.02267 * i - 0.0001302 * i ** 2;
      case 'jupiter': return base - 9.395 - 3.7e-4 * i + 6.16e-4 * i ** 2;
      case 'saturne': return base - 8.914 + 0.026 * i;
      case 'uranus': return base - 7.110 + 6.587e-3 * i;
      default: return base - 7.00;

  // Tous les astres mobiles pour un instant : vecteurs équatoriaux J2000 + infos
  function astresMobiles(jd) {
    const terre = helio('terre', jd);
    const res = [];
    const soleilGeo = terre.map(x => -x);
    res.push({ id: 'soleil', nom: 'Soleil', type: 'soleil', eq: eclVersEq(soleilGeo), distUA: Math.hypot(...terre), mag: -26.7 });
    for (const p of PLANETES) {
      const h = helio(p.id, jd), g = h.map((x, i) => x - terre[i]);
      const r = Math.hypot(...h), delta = Math.hypot(...g);
      const cosPhase = (r * r + delta * delta - Math.hypot(...terre) ** 2) / (2 * r * delta);
      const phase = Math.acos(Math.max(-1, Math.min(1, cosPhase))) * DEG;
      res.push({ ...p, type: 'planete', eq: eclVersEq(g), distUA: delta, rSoleil: r, phase, mag: magnitude(p.id, r, delta, phase) });
    }
    const L = lune(jd), eqL = eclVersEq(L.ecl);
    const elong = angle(eqL, eclVersEq(soleilGeo));
    res.push({ id: 'lune', nom: 'Lune', type: 'lune', eq: eqL, distKm: L.dist, elongation: elong, eclairement: (1 - Math.cos(elong * RAD)) / 2, mag: -12.7 + 0.026 * (180 - elong) });
    return res;
  }

  function angle(a, b) {
    const ca = (a[0] * b[0] + a[1] * b[1] + a[2] * b[2]) / (Math.hypot(...a) * Math.hypot(...b));
    return Math.acos(Math.max(-1, Math.min(1, ca))) * DEG;
  }

  // Âge de la Lune (jours depuis la nouvelle Lune) à partir de l'élongation et de son sens
  function infosLune(jd) {
    const L = lune(jd), terre = helio('terre', jd);
    const lonL = Math.atan2(L.ecl[1], L.ecl[0]) * DEG, lonS = Math.atan2(-terre[1], -terre[0]) * DEG;
    const ecart = norm360(lonL - lonS); // 0 = nouvelle, 180 = pleine
    const age = ecart / 360 * 29.530589;
    const eclairement = (1 - Math.cos(ecart * RAD)) / 2;
    let nom;
    if (ecart < 10 || ecart > 350) nom = 'Nouvelle Lune';
    else if (ecart < 80) nom = 'Premier croissant';
    else if (ecart < 100) nom = 'Premier quartier';
    else if (ecart < 170) nom = 'Lune gibbeuse croissante';
    else if (ecart < 190) nom = 'Pleine Lune';
    else if (ecart < 260) nom = 'Lune gibbeuse décroissante';
    else if (ecart < 280) nom = 'Dernier quartier';
    else nom = 'Dernier croissant';
    return { ecart, age, eclairement, nom, distKm: L.dist };
  }

  // Cherche les instants où l'écart Lune-Soleil passe par 0, 90, 180, 270° entre deux dates
  function phasesLune(jdDebut, jdFin) {
    const res = [], noms = ['Nouvelle Lune', 'Premier quartier', 'Pleine Lune', 'Dernier quartier'];
    const ecart = jd => infosLune(jd).ecart;
    let jd = jdDebut, prec = ecart(jd);
    while (jd < jdFin) {
      const jd2 = jd + 0.25, e2 = ecart(jd2);
      for (let k = 0; k < 4; k++) {
        const cible = k * 90;
        const a = norm360(prec - cible + 180) - 180, b = norm360(e2 - cible + 180) - 180;
        if (a < 0 && b >= 0) {
          let lo = jd, hi = jd2;
          for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; if (norm360(ecart(m) - cible + 180) - 180 < 0) lo = m; else hi = m; }
          res.push({ jd: (lo + hi) / 2, nom: noms[k], k });
        }
      }
      jd = jd2; prec = e2;
    }
    return res;
  }

  // Prochaines oppositions (planètes extérieures) et plus grandes élongations (Mercure, Vénus)

    F('betelgeuse', 'Étoiles', 'Bételgeuse, la géante rouge d’Orion', ['betelgeuse', 'orion', 'geante rouge', 'supergeante'],
      `<p>L’épaule d’Orion est une supergéante rouge si grande que, placée à la place du Soleil, elle engloutirait Mars et peut-être Jupiter. Elle se trouve à environ 550 années-lumière.</p>
      <p>Fin 2019 et début 2020, son éclat a fortement baissé : c’était un nuage de poussières qu’elle avait expulsé, et non l’explosion. Elle deviendra une supernova d’ici quelques centaines de milliers d’années au plus ; elle brillera alors comme une demi-Lune, visible en plein jour. En 2025, des astronomes ont détecté une petite étoile compagne qui tourne autour d’elle.</p>`, { ciel: 'Betelgeuse' }),
    F('exoplanetes', 'Étoiles', 'Les exoplanètes', ['exoplanete', 'autre planete', 'trappist', 'proxima b', '51 pegasi', 'habitable', 'autres mondes'],
      `<p>Une exoplanète tourne autour d’une autre étoile que le Soleil. La première autour d’une étoile semblable au Soleil, <b>51 Pegasi b</b>, a été découverte en 1995 par les Suisses Michel Mayor et Didier Queloz (prix Nobel 2019).</p>
      <p>On en a confirmé <b>plus de 6 000</b> (le compte grandit chaque mois). Le système <b>TRAPPIST-1</b>, à 40 années-lumière, compte sept planètes de la taille de la Terre, dont plusieurs dans la zone où l’eau pourrait être liquide. L’étoile la plus proche, Proxima du Centaure, a elle aussi une planète tempérée.</p>
      <p>On les trouve surtout par la méthode des <b>transits</b> (la planète passe devant son étoile et fait baisser son éclat) et des vitesses radiales (l’étoile « tangue » sous l’effet de la planète).</p>`, { nasa: 'exoplanet', cosmos: 'voisinage' }),
    F('nebuleuses', 'Étoiles', 'Les nébuleuses', ['nebuleuse', 'orion', 'm42', 'piliers', 'aigle', 'pouponniere', 'gaz', 'poussiere'],
      `<p>Des nuages de gaz et de poussières. Certaines sont des <b>pouponnières d’étoiles</b>, comme la grande nébuleuse d’Orion (M42, visible à l’œil nu sous l’épée d’Orion) ou la nébuleuse de l’Aigle et ses célèbres Piliers de la Création. D’autres sont les restes d’étoiles mortes : nébuleuses planétaires (M57, l’Anneau) et restes de supernovas (M1, le Crabe).</p>
      <p>Leurs couleurs sur les photos viennent des atomes qui brillent : le rouge de l’hydrogène, le vert-bleu de l’oxygène.</p>`, { ciel: 'M42', nasa: 'nebula Hubble' }),
    F('amas', 'Étoiles', 'Amas d’étoiles', ['amas', 'pleiades', 'globulaire', 'ouvert', 'm13', 'm45', 'creche'],
      `<p><b>Amas ouverts</b> : quelques centaines d’étoiles jeunes nées ensemble, comme les <b>Pléiades</b> (M45), visibles à l’œil nu en hiver : on en compte 6 ou 7 à l’œil, plus de 1 000 en réalité.</p>
      <p><b>Amas globulaires</b> : des boules de centaines de milliers d’étoiles très vieilles (plus de 10 milliards d’années) qui tournent autour de la galaxie, comme le grand amas d’Hercule (M13).</p>`, { ciel: 'Pleiades' }),
    F('etoile-polaire', 'Observer', 'Trouver l’étoile Polaire et le nord', ['polaire', 'nord', 'grande ourse', 'casserole', 'orientation', 'boussole'],
      `<p>Repère la <b>Grande Ourse</b> (la « casserole »), toujours visible depuis la France. Prolonge environ cinq fois la distance entre les deux étoiles du bord de la casserole (Merak et Dubhe) : tu tombes sur l’<b>étoile Polaire</b>. Elle indique le nord à moins d’un degré près.</p>
      <p>La Polaire n’est pas l’étoile la plus brillante (c’est Sirius), mais elle ne bouge presque pas : tout le ciel semble tourner autour d’elle. Sa hauteur au-dessus de l’horizon est égale à ta latitude : 49° à Paris.</p>`, { ciel: 'Polaris', schema: 'polaire' }),

    // Galaxies et cosmos
    F('voie-lactee', 'Galaxies et cosmos', 'La Voie lactée, notre galaxie', ['voie lactee', 'galaxie', 'notre galaxie', 'bras', 'centre galactique'],
      `<p>Une galaxie spirale barrée d’environ 100 000 années-lumière de diamètre, qui compte 100 à 400 milliards d’étoiles. Le Soleil se trouve dans un petit bras, à 26 000 années-lumière du centre, et en fait le tour en 230 millions d’années.</p>
      <p>La bande laiteuse que l’on voit dans un ciel sans pollution lumineuse, c’est le disque de notre galaxie vu de l’intérieur. En été, regarde vers le Sagittaire, au sud : c’est la direction du centre, où se cache le trou noir Sagittarius A*.</p>`, { cosmos: 'galaxie', nasa: 'Milky Way' }),
    F('andromede', 'Galaxies et cosmos', 'La galaxie d’Andromède', ['andromede', 'm31', 'collision', 'galaxie voisine'],
      `<p>Notre grande voisine, à 2,5 millions d’années-lumière : l’objet le plus lointain visible à l’œil nu. Elle contient environ mille milliards d’étoiles. La lumière que tu en reçois est partie quand les premiers humains du genre <i>Homo</i> marchaient en Afrique.</p>
      <p>Elle se rapproche à 110 km/s. Une fusion avec la Voie lactée est possible dans 4 à 5 milliards d’années ; une étude de 2025 estime qu’elle n’a qu’environ une chance sur deux de se produire dans les 10 milliards d’années à venir. Les étoiles ne se percuteraient pas : elles sont bien trop espacées.</p>
      <p>Pour la voir : en automne, cherche une petite tache floue près du carré de Pégase, de préférence avec des jumelles.</p>`, { ciel: 'M31', cosmos: 'groupe', nasa: 'Andromeda galaxy' }),
    F('galaxies', 'Galaxies et cosmos', 'Les types de galaxies', ['galaxie', 'spirale', 'elliptique', 'irreguliere', 'hubble', 'combien de galaxies'],
      `<p>Edwin Hubble a classé les galaxies selon leur forme : <b>elliptiques</b> (des ballons d’étoiles vieilles), <b>spirales</b> (avec ou sans barre, comme la nôtre) et <b>irrégulières</b>. L’univers observable en compterait environ 2 000 milliards.</p>
      <p>En 1923, en observant des étoiles variables dans Andromède, Hubble a prouvé qu’elle était bien au-delà de la Voie lactée : l’univers est devenu d’un coup immensément plus grand.</p>`, { schema: 'hubble', ciel: 'M51' }),
    F('big-bang', 'Galaxies et cosmos', 'Le Big Bang et l’histoire de l’univers', ['big bang', 'origine', 'age de l univers', 'debut', 'commencement', 'premieres etoiles', 'chronologie'],
      `<p>L’univers a <b>13,8 milliards d’années</b>. Au départ, il était extrêmement chaud et dense, puis il s’est dilaté et refroidi. Le « Big Bang » n’est pas une explosion dans l’espace : c’est l’espace lui-même qui s’étire partout à la fois.</p>
      <ul><li>Premières minutes : formation des noyaux d’hydrogène et d’hélium.</li>
      <li>380 000 ans : l’univers devient transparent ; cette lumière nous parvient encore (le fond diffus cosmologique).</li>
      <li>Environ 100 à 200 millions d’années : les premières étoiles s’allument.</li>
      <li>9,2 milliards d’années : naissance du Soleil et de la Terre.</li></ul>
      <p>Le télescope James Webb observe des galaxies qui existaient moins de 300 millions d’années après le Big Bang.</p>`, { schema: 'chrono', demo: 'expansion' }),
    F('expansion', 'Galaxies et cosmos', 'L’expansion de l’univers', ['expansion', 'redshift', 'decalage vers le rouge', 'hubble lemaitre', 'galaxies s eloignent', 'constante de hubble'],
      `<p>En 1927, le Belge Georges Lemaître propose que l’univers est en expansion ; en 1929, Edwin Hubble montre que plus une galaxie est loin, plus elle s’éloigne vite. La lumière des galaxies lointaines est étirée vers le rouge : c’est le <b>décalage vers le rouge</b>.</p>
      <p>Le rythme actuel est d’environ 70 km/s par mégaparsec, mais deux méthodes de mesure donnent des valeurs différentes (67 et 73) : c’est la <b>tension de Hubble</b>, une énigme non résolue. Depuis 1998, on sait que l’expansion <b>accélère</b>.</p>`, { demo: 'expansion' }),
    F('matiere-noire', 'Galaxies et cosmos', 'Matière noire et énergie noire', ['matiere noire', 'energie noire', 'composition', 'invisible', 'mystere'],
      `<p>Tout ce que nous voyons (étoiles, planètes, gaz, nous) ne représente qu’environ <b>5 %</b> du contenu de l’univers. Environ <b>27 %</b> est une <b>matière noire</b> invisible, détectée seulement par sa gravité : sans elle, les galaxies tourneraient trop vite pour rester entières. Les <b>68 %</b> restants sont une <b>énergie noire</b> qui accélère l’expansion.</p>
      <p>Personne ne sait encore ce qu’elles sont. Les relevés DESI (2024-2025) suggèrent que l’énergie noire pourrait varier avec le temps ; le télescope Euclid cartographie l’univers sombre depuis 2023.</p>`),
    F('fond-diffus', 'Galaxies et cosmos', 'Le fond diffus cosmologique', ['fond diffus', 'cmb', 'rayonnement fossile', 'plus vieille lumiere', 'planck'],
      `<p>La plus vieille lumière de l’univers, émise 380 000 ans après le Big Bang, quand il est devenu transparent. Étirée par l’expansion, elle nous arrive aujourd’hui sous forme de micro-ondes, à −270,4 °C (2,7 K).</p>
      <p>Découverte par hasard en 1964 par Penzias et Wilson, qui croyaient d’abord à des fientes de pigeons dans leur antenne ! Une petite partie de la « neige » des anciennes télévisions venait de là.</p>`),
    F('univers-observable', 'Galaxies et cosmos', 'L’univers observable', ['taille de l univers', 'univers observable', 'infini', 'bord', 'combien grand'],
      `<p>Nous ne voyons que la partie de l’univers dont la lumière a eu le temps de nous parvenir : c’est l’<b>univers observable</b>, une sphère d’environ <b>93 milliards d’années-lumière de diamètre</b>. Plus que 2 × 13,8 milliards, car l’espace s’est dilaté pendant le trajet de la lumière.</p>
      <p>Au-delà, l’univers continue, peut-être à l’infini. Il n’a ni centre ni bord : chaque observateur, partout, se voit au centre de sa propre sphère observable.</p>`, { cosmos: 'echelle' }),
    F('ondes-gravitationnelles', 'Galaxies et cosmos', 'Les ondes gravitationnelles', ['ondes gravitationnelles', 'ligo', 'virgo', 'einstein', 'espace temps'],
      `<p>Prédites par Einstein en 1916 : des vibrations de l’espace-temps lui-même, produites par des masses énormes qui accélèrent, comme deux trous noirs qui fusionnent. Le 14 septembre 2015, les détecteurs LIGO en ont capté une pour la première fois (prix Nobel 2017), venue d’une collision de trous noirs à 1,3 milliard d’années-lumière.</p>
      <p>La déformation mesurée était mille fois plus petite qu’un proton sur 4 km. Le détecteur européen Virgo, près de Pise, participe aux observations ; on en détecte désormais plusieurs par semaine.</p>`),

    // Observer
    F('debuter', 'Observer', 'Bien débuter en astronomie', ['debuter', 'commencer', 'conseils', 'observer', 'premiere fois', 'adaptation', 'lampe rouge'],
      `<ol><li><b>Commence à l’œil nu.</b> Apprends quelques constellations : Grande Ourse, Cassiopée, Orion en hiver, le Triangle d’été.</li>
      <li><b>Laisse tes yeux s’adapter 20 minutes</b> au noir. Une seule lumière blanche ruine cette adaptation : utilise une lampe rouge (ou le mode 🔴 Nuit de cette appli).</li>
      <li><b>Fuis la pollution lumineuse</b> et choisis une nuit sans Lune pour les objets faibles.</li>
      <li><b>Prends des jumelles</b> (7×50 ou 10×50) avant un télescope : cratères lunaires, lunes de Jupiter, Pléiades, Andromède.</li>
      <li><b>Couvre-toi</b> : on a toujours plus froid qu’on ne pense en restant immobile.</li>
      <li><b>Note ce que tu vois</b> et relève les défis de l’onglet « Défis ».</li></ol>`, { schema: 'telescopes' }),
    F('instruments', 'Observer', 'Jumelles et télescopes', ['telescope', 'lunette', 'jumelles', 'grossissement', 'achat', 'acheter', 'dobson', 'instrument'],
      `<p>Le plus important n’est pas le grossissement mais le <b>diamètre</b> (l’ouverture) : plus il est grand, plus l’instrument capte de lumière et montre de détails.</p>
      <ul><li><b>Jumelles 10×50</b> : grossissent 10 fois, 50 mm de diamètre. Parfaites pour débuter.</li>
      <li><b>Lunette</b> (réfracteur, avec des lentilles) : image nette, idéale pour la Lune et les planètes.</li>
      <li><b>Télescope</b> (réflecteur, avec un miroir) : plus de diamètre pour le même prix. Un Dobson de 150 à 200 mm est un excellent premier télescope.</li></ul>
      <p>Méfie-toi des publicités « grossit 500 fois » : au-delà de deux fois le diamètre en millimètres, l’image devient floue.</p>`, { schema: 'telescopes' }),
    F('constellations', 'Observer', 'Les constellations', ['constellation', 'zodiaque', 'signe', 'ophiuchus', 'orion', 'cassiopee', '88'],
      `<p>Le ciel est découpé officiellement en <b>88 constellations</b> depuis 1922 : des régions du ciel, comme les pays d’une carte. Les étoiles d’une constellation n’ont souvent rien à voir entre elles : elles sont à des distances très différentes et semblent proches par effet de perspective.</p>
      <p>Le Soleil traverse en réalité <b>13</b> constellations du zodiaque, dont Ophiuchus (le Serpentaire), et ses dates de passage ont glissé de près d’un mois depuis l’Antiquité à cause de la précession. L’astrologie n’a aucun fondement scientifique ; l’astronomie, si.</p>`, { quiz: 'constellations' }),
    F('magnitude', 'Observer', 'La magnitude : mesurer l’éclat', ['magnitude', 'eclat', 'brillance', 'plus brillante', 'sirius'],
      `<p>Plus la magnitude est <b>petite</b>, plus l’astre est brillant. Une différence de 5 magnitudes correspond à un facteur 100 en éclat.</p>
      <ul><li>Soleil −26,7 · pleine Lune −12,7 · Vénus jusqu’à −4,6 · Jupiter −2,9 au mieux · Sirius −1,46</li>
      <li>Étoiles les plus faibles visibles à l’œil nu : environ 6 sous un ciel noir, 3 ou 4 en ville.</li>
      <li>Le télescope James Webb atteint des objets de magnitude 29 ou plus : des milliards de fois plus faibles.</li></ul>`),
    F('pollution-lumineuse', 'Observer', 'La pollution lumineuse', ['pollution lumineuse', 'ville', 'ciel noir', 'bortle', 'eclairage', 'reserve de ciel etoile'],
      `<p>Plus d’un tiers de l’humanité ne voit plus la Voie lactée. En ville, on ne voit que quelques dizaines d’étoiles contre environ 3 000 sous un ciel noir. L’éclairage nocturne perturbe aussi les oiseaux migrateurs, les insectes et notre sommeil.</p>
      <p>En France, des <b>réserves internationales de ciel étoilé</b> protègent la nuit : Pic du Midi, Cévennes, Alpes Azur Mercantour, Millevaches. Les constellations de satellites (des milliers de Starlink) posent aussi un nouveau défi aux astronomes.</p>`),
    F('photo-ciel', 'Observer', 'Photographier le ciel', ['photo', 'photographier', 'smartphone', 'astrophoto', 'pose longue', 'telephone'],
      `<ul><li><b>Lune au smartphone</b> : pose le téléphone contre l’oculaire de jumelles ou d’un télescope (méthode afocale), baisse l’exposition.</li>
      <li><b>Voie lactée</b> : appareil sur trépied, objectif grand-angle très ouvert (f/2,8 ou moins), pose de 15 à 25 secondes, ISO 1600 à 3200, mise au point manuelle sur une étoile brillante.</li>
      <li><b>Filés d’étoiles</b> : des centaines de photos de 30 s empilées montrent la rotation du ciel autour de la Polaire.</li>
      <li>Beaucoup de smartphones récents ont un mode « nuit » ou « astro » de plusieurs minutes : pose-les bien stables.</li></ul>`),
    F('iss', 'Exploration', 'La Station spatiale internationale', ['iss', 'station spatiale', 'pesquet', 'adenot', 'astronaute', 'voir l iss'],
      `<p>Elle tourne à environ 400 km d’altitude, à 28 000 km/h : un tour de la Terre en 92 minutes, soit environ 16 levers de Soleil par jour. Occupée en permanence depuis novembre 2000. Sa fin de vie est prévue vers 2030.</p>
      <p>On la voit à l’œil nu comme un point très brillant qui traverse le ciel en quelques minutes sans clignoter, juste après le coucher ou avant le lever du Soleil. Les Français Thomas Pesquet (2016-2017 et 2021) et Sophie Adenot (mission εpsilon, 2026) y ont séjourné.</p>`, { nasa: 'International Space Station' }),
    F('aurores', 'Phénomènes', 'Les aurores polaires', ['aurore', 'boreale', 'australe', 'vent solaire', 'tempete solaire', 'eruption solaire'],
      `<p>Des particules du vent solaire, guidées par le champ magnétique terrestre vers les pôles, excitent les atomes de la haute atmosphère : l’oxygène brille en vert (et en rouge plus haut), l’azote en bleu et violet.</p>
      <p>Lors des grandes tempêtes solaires, comme en mai et en octobre 2024, des aurores ont été visibles jusqu’en France et dans le sud de l’Europe. Le Soleil était alors au maximum de son cycle d’activité de 11 ans.</p>`, { nasa: 'aurora' }),

    // Phénomènes
    F('phases-lune', 'Phénomènes', 'Les phases de la Lune', ['phase', 'phases', 'croissant', 'pleine lune', 'nouvelle lune', 'quartier', 'gibbeuse'],
      `<p>La Lune ne produit pas de lumière : elle est toujours éclairée à moitié par le Soleil. Selon sa position autour de la Terre, nous voyons une portion plus ou moins grande de sa moitié éclairée. Le cycle complet dure <b>29,5 jours</b>.</p>
      <p>Astuce : dans l’hémisphère nord, si le croissant forme un <b>« p »</b> (arrondi à droite), elle est en <b>premier</b> quartier et croît ; s’il forme un « d » (arrondi à gauche), elle <b>décroît</b>. La Lune ment : « C » comme croissant ne marche pas !</p>
      <p>Le meilleur moment pour observer les cratères aux jumelles n’est pas la pleine Lune mais le premier quartier : les ombres sont longues le long du terminateur.</p>`, { schema: 'phases', demo: 'phases', ciel: 'Lune' }),
    F('saisons', 'Phénomènes', 'Pourquoi les saisons ?', ['saison', 'ete', 'hiver', 'solstice', 'equinoxe', 'inclinaison', 'axe'],
      `<p>Ce n’est <b>pas</b> la distance au Soleil : la Terre en est même au plus près début janvier, en plein hiver boréal ! C’est l’<b>inclinaison de 23,4°</b> de l’axe de la Terre.</p>
      <p>En juin, l’hémisphère nord penche vers le Soleil : les rayons arrivent plus droits (ils chauffent davantage une même surface) et les jours sont longs. En décembre, c’est l’inverse. Les saisons sont donc opposées dans l’hémisphère sud.</p>
      <p>Solstices : vers le 21 juin et le 21 décembre. Équinoxes (jour et nuit égaux) : vers le 20 mars et le 22 septembre.</p>`, { schema: 'saisons', demo: 'saisons' }),
    F('eclipses', 'Phénomènes', 'Les éclipses', ['eclipse', 'eclipse solaire', 'eclipse lunaire', 'lune rouge', 'lune de sang', 'totale', 'annulaire'],
      `<p><b>Éclipse de Soleil</b> : la Lune passe devant le Soleil (à la nouvelle Lune). Par un hasard extraordinaire, le Soleil est 400 fois plus grand que la Lune mais aussi 400 fois plus loin : elle le couvre presque exactement. Pendant la totalité, on voit la couronne solaire et des étoiles en plein jour.</p>
      <p><b>Éclipse de Lune</b> : la Lune passe dans l’ombre de la Terre (à la pleine Lune). Elle devient rouge cuivré, éclairée par la lumière de tous les couchers de Soleil de la Terre filtrée par notre atmosphère.</p>
      <p>Il n’y en a pas à chaque Lune car l’orbite lunaire est inclinée de 5° : il faut que les trois astres soient bien alignés.</p>
      <p><b>⚠️ Ne regarde jamais une éclipse de Soleil sans lunettes spéciales certifiées ISO 12312-2.</b> Prochaine éclipse totale proche de la France : <b>2 août 2027</b>, visible totale dans le sud de l’Espagne et en Afrique du Nord.</p>`, { schema: 'eclipses', demo: 'eclipses' }),
    F('marees', 'Phénomènes', 'Les marées', ['maree', 'ocean', 'attraction', 'gravitation lune', 'vive eau', 'mont saint michel'],
      `<p>La Lune attire un peu plus fort le côté de la Terre qui lui fait face que le centre, et le centre un peu plus que le côté opposé : les océans forment deux bourrelets, d’où deux marées hautes par jour environ.</p>
      <p>Quand le Soleil et la Lune sont alignés (nouvelle et pleine Lune), leurs effets s’additionnent : ce sont les grandes marées de vives-eaux. En baie du Mont-Saint-Michel, le marnage dépasse 14 mètres.</p>`),
    F('lumiere', 'Phénomènes', 'La lumière et l’année-lumière', ['annee lumiere', 'vitesse de la lumiere', 'lumiere', 'passe', 'regarder loin', 'spectre', 'ondes', 'infrarouge'],
      `<p>La lumière parcourt <b>299 792 km par seconde</b>. Une année-lumière est la distance qu’elle parcourt en un an : environ <b>9 461 milliards de km</b>. C’est une distance, pas une durée.</p>
      <p>Regarder loin, c’est regarder dans le passé : tu vois la Lune telle qu’elle était il y a 1,3 seconde, le Soleil il y a 8 minutes, Andromède il y a 2,5 millions d’années.</p>
      <p>Nos yeux ne voient qu’une toute petite partie de la lumière. Les télescopes observent aussi en radio, infrarouge (James Webb), ultraviolet, rayons X et gamma : chaque « couleur » révèle d’autres phénomènes.</p>`, { schema: 'spectre' }),

    // Exploration
    F('conquete', 'Exploration', 'La conquête spatiale', ['conquete spatiale', 'spoutnik', 'gagarine', 'apollo', 'armstrong', 'premier homme', 'lune 1969', 'histoire espace'],
      `<ul><li><b>4 octobre 1957</b> : Spoutnik 1, premier satellite artificiel (URSS).</li>
      <li><b>12 avril 1961</b> : Youri Gagarine, premier humain dans l’espace.</li>
      <li><b>16 juin 1963</b> : Valentina Terechkova, première femme dans l’espace.</li>
      <li><b>21 juillet 1969</b> : Neil Armstrong et Buzz Aldrin marchent sur la Lune (Apollo 11). Douze astronautes y ont marché jusqu’à Apollo 17 en décembre 1972.</li>
      <li><b>1990</b> : lancement du télescope spatial Hubble.</li>
      <li><b>1998 à 2000</b> : construction puis occupation permanente de la Station spatiale internationale.</li>
      <li><b>2021</b> : lancement du télescope James Webb ; le rover Perseverance et l’hélicoptère Ingenuity sur Mars.</li>
      <li><b>2026</b> : Artemis II, premier vol habité autour de la Lune depuis 1972.</li></ul>`, { nasa: 'Apollo 11' }),
    F('telescopes-spatiaux', 'Exploration', 'Les grands télescopes', ['hubble', 'james webb', 'jwst', 'euclid', 'gaia', 'rubin', 'elt', 'telescope spatial'],
      `<ul><li><b>Hubble</b> (1990) : miroir de 2,4 m, en orbite à 540 km. Il a mesuré l’âge de l’univers et révélé le champ profond.</li>
      <li><b>James Webb</b> (lancé le 25 décembre 2021) : miroir de 6,5 m, observe en infrarouge depuis le point de Lagrange L2, à 1,5 million de km.</li>
      <li><b>Gaia</b> (2013-2025) : a mesuré la position et le mouvement de près de 2 milliards d’étoiles de la Voie lactée.</li>
      <li><b>Euclid</b> (2023) : cartographie la matière noire et l’énergie noire.</li>
      <li><b>Observatoire Vera C. Rubin</b> (Chili, premières images en 2025) : sa caméra de 3,2 milliards de pixels photographie tout le ciel austral tous les trois jours environ.</li>
      <li><b>ELT</b> européen (Chili, en construction) : miroir de 39 m, le plus grand télescope optique du monde.</li></ul>`, { nasa: 'James Webb Space Telescope' }),

        if (m.length < 3) continue;

      return { f: e.f, score };

// Petit moteur 3D maison (perspective, caméra en orbite) utilisé par le système solaire et l'univers.
class Camera3D {
  constructor({ yaw = -0.6, pitch = 0.45, dist = 40, fov = 50, min = 0.5, max = 5000 } = {}) {
    Object.assign(this, { yaw, pitch, dist, fov, min, max });
    this.cible = [0, 0, 0];
    this.W = 1; this.H = 1;
  }
  preparer(W, H) {
    this.W = W; this.H = H;
    const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch), cy = Math.cos(this.yaw), sy = Math.sin(this.yaw);
    this.pos = [this.cible[0] + this.dist * cp * cy, this.cible[1] + this.dist * cp * sy, this.cible[2] + this.dist * sp];
    const f = [this.cible[0] - this.pos[0], this.cible[1] - this.pos[1], this.cible[2] - this.pos[2]];
    const n = Math.hypot(...f); this.F = f.map(v => v / n);
    const r = [this.F[1], -this.F[0], 0], nr = Math.hypot(...r) || 1; this.R = r.map(v => v / nr);
    this.U = [this.R[1] * this.F[2] - this.R[2] * this.F[1], this.R[2] * this.F[0] - this.R[0] * this.F[2], this.R[0] * this.F[1] - this.R[1] * this.F[0]];
    this.focale = (Math.max(W, H) / 2) / Math.tan(this.fov * Math.PI / 360);
  }
  // Retourne {x, y, z, k} (k = pixels par unité à cette profondeur) ou null si derrière la caméra
  projeter(p) {
    const d0 = p[0] - this.pos[0], d1 = p[1] - this.pos[1], d2 = p[2] - this.pos[2];
    const z = d0 * this.F[0] + d1 * this.F[1] + d2 * this.F[2];
    if (z < this.dist * 0.01 + 0.01) return null;

// Disque éclairé façon sphère : texture (canvas carré) + ombre selon la direction de la lumière
function dessinerSphere(ctx, x, y, r, texture, lumiere, vers) {
  // lumiere : vecteur unitaire (repère écran) de l'astre vers la source ; vers : (0,0,-1) vers la caméra
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.clip();
  if (texture) ctx.drawImage(texture, x - r, y - r, 2 * r, 2 * r);
  if (lumiere) {
    const cosI = -lumiere[2]; // angle de phase : lumière vs direction de la caméra
    const ang = Math.atan2(-lumiere[1], lumiere[0]);
    ctx.translate(x, y); ctx.rotate(ang);
    ctx.fillStyle = 'rgba(2,3,10,.8)';
    ctx.beginPath(); ctx.arc(0, 0, r + 1, Math.PI / 2, 3 * Math.PI / 2, false);
    for (let k = -20; k <= 20; k++) { const yy = r * k / 20; ctx.lineTo(-cosI * Math.sqrt(Math.max(0, r * r - yy * yy)), yy); }
    ctx.closePath(); ctx.fill();
    const g = ctx.createRadialGradient(0, 0, r * 0.6, 0, 0, r);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.45)');
    ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, 2 * r);
  }
  ctx.restore();
}

      for (const c of lignesConst) for (const poly of c.polys) tracer(poly.map(versH), selection && selection.type === 'constellation' && selection.id === c.id ? 'rgba(255,210,122,.9)' : 'rgba(110,150,255,.42)', selection && selection.id === c.id ? 2 : 1);
    }

    // Étoiles
    const zoom = Math.min(2.2, Math.max(0.8, Math.sqrt(90 / vue.fov)));
    const limNoms = vue.fov > 130 ? 0.6 : vue.fov > 70 ? 1.6 : vue.fov > 35 ? 2.6 : vue.fov > 15 ? 3.6 : 5;
    ctx.font = '12px system-ui, sans-serif'; ctx.textBaseline = 'middle';
    for (let i = nbEtoiles - 1; i >= 0; i--) {
      let m = magE[i];
      if (m > limite + 0.6) continue;
      const v0 = vecE[i * 3], v1 = vecE[i * 3 + 1], v2 = vecE[i * 3 + 2];
      const n = M[0][0] * v0 + M[0][1] * v1 + M[0][2] * v2, e = M[1][0] * v0 + M[1][1] * v1 + M[1][2] * v2, u = M[2][0] * v0 + M[2][1] * v1 + M[2][2] * v2;
      if (opt.sol && u < -0.005) continue;
      if (opt.atmosphere && u > 0) m += 0.2 / Math.max(u, 0.04) - 0.2; // extinction près de l'horizon
      if (m > limite) continue;
      if (!projH(n, e, u)) continue;
      const r = (0.6 + Math.max(0, limite - m) * 0.5) * zoom;
      const a = Math.max(0.18, Math.min(1, (limite - m) / 2.2));
      if (m < 1.6 && nuit > 0.2) {
        const t = r * 5;
        ctx.globalAlpha = 0.5 * a; ctx.drawImage(haloDe(coulE[i]), P.x - t, P.y - t, t * 2, t * 2);
      }
      ctx.globalAlpha = a; ctx.fillStyle = coulE[i];
      ctx.beginPath(); ctx.arc(P.x, P.y, r, 0, 2 * Math.PI); ctx.fill();
      ctx.globalAlpha = 1;
      if (m < 5.2) touches.push({ x: P.x, y: P.y, r: r + 4, type: 'etoile', i, m });
      if (opt.nomsEtoiles && m < limNoms) { const nm = nomAffiche(i); if (nm) { ctx.fillStyle = 'rgba(220,228,255,.82)'; ctx.fillText(nm, P.x + r + 4, P.y); } }
    }

    // Objets de Messier
    if (opt.messier) {
      const limM = vue.fov > 120 ? 5 : vue.fov > 60 ? 7.5 : 11;
      for (const o of messier) {
        if (o.mag > limM || o.mag > limite + 1.5) continue;
        const h = versH(o.v);
        if (opt.sol && h[2] < 0) continue;
        if (!projH(h[0], h[1], h[2])) continue;
        dessinerIconeMessier(o, P.x, P.y);
        touches.push({ x: P.x, y: P.y, r: 10, type: 'messier', o, m: o.mag + 2 });
      }
    }

    // Astres mobiles
    if (opt.planetes) {
      const ordre = mobiles.slice().sort((a, b) => b.distUA - a.distUA);
      for (const a of ordre) {
        const h = versH(a.eq);
        if (a.type === 'lune') { // parallaxe : on observe depuis la surface, pas depuis le centre de la Terre
          const d = a.distKm / 6371; h[0] *= d; h[1] *= d; h[2] = h[2] * d - 1; const n = Math.hypot(...h); h[0] /= n; h[1] /= n; h[2] /= n;
          a.h = h;
        }
        a.alt = Math.asin(Math.max(-1, Math.min(1, h[2]))) * DEG; a.az = Astro.norm360(Math.atan2(h[1], h[0]) * DEG);

        if (a.type === 'planete' && a.mag > limite + 1) continue;
        if (!projH(h[0], h[1], h[2])) continue;
        const x = P.x, y = P.y;
        if (a.type === 'soleil') dessinerSoleil(x, y);
        else if (a.type === 'lune') dessinerLune(a, h, hSol, x, y);
        else dessinerPlanete(a, x, y, nuit);
        const r = a.type === 'planete' ? 9 : Math.max(12, 0.27 * RAD * S);
        touches.push({ x, y, r, type: a.type, a, m: -30 });
        ctx.fillStyle = a.type === 'planete' ? '#ffd27a' : '#fff1c4'; ctx.font = '600 13px system-ui, sans-serif';
        ctx.fillText(a.nom, x + r * (a.type === 'planete' ? 0.8 : 1) + 5, y);
      }
    }

    // Sol et horizon
    dessinerSol(hSol);

    // Noms des constellations
    if (opt.nomsConstel && opt.constellations) {
      ctx.font = '600 12px system-ui, sans-serif'; ctx.textAlign = 'center';
      for (const c of constels) {
        if (vue.fov > 150 && c.rang > 1) continue;
        if (vue.fov > 100 && c.rang > 2) continue;
        const h = versH(c.v);
        if (opt.sol && h[2] < 0.02) continue;
        if (!projH(h[0], h[1], h[2])) continue;
        ctx.fillStyle = selection && selection.id === c.id ? '#ffd27a' : 'rgba(150,180,255,.78)';
        ctx.fillText(c.fr.toUpperCase(), P.x, P.y);
        touches.push({ x: P.x, y: P.y, r: 26, type: 'constellation', c, m: 50 });
      }
      ctx.textAlign = 'left';
    }

    // Repère de sélection (visible même sous l'horizon)
    if (selection) {
      const pos = objetPosition(selection);
      if (pos && projH(pos.h[0], pos.h[1], pos.h[2])) {
        const t = performance.now() / 600, r = 16 + Math.sin(t) * 2;
        ctx.strokeStyle = '#ffd27a'; ctx.lineWidth = 1.6;
        for (let k = 0; k < 4; k++) { const a0 = k * Math.PI / 2 + Math.PI / 4; ctx.beginPath(); ctx.arc(P.x, P.y, r, a0 - 0.45, a0 + 0.45); ctx.stroke(); }
        sale = true;
      }
    }
    majInfos();
  }

  function dessinerIconeMessier(o, x, y) {
    ctx.strokeStyle = 'rgba(255,150,210,.75)'; ctx.lineWidth = 1;
    const t = o.type;
    ctx.beginPath();
    if ('seis'.includes(t) && t.length === 1) ctx.ellipse(x, y, 7, 3.5, -0.5, 0, 2 * Math.PI);
    else if (t === 'gc') { ctx.arc(x, y, 5, 0, 2 * Math.PI); ctx.moveTo(x - 5, y); ctx.lineTo(x + 5, y); ctx.moveTo(x, y - 5); ctx.lineTo(x, y + 5); }
    else if (t === 'oc' || t === 'pos') { ctx.setLineDash([2, 2]); ctx.arc(x, y, 6, 0, 2 * Math.PI); }
    else if (t === 'pn') { ctx.arc(x, y, 4, 0, 2 * Math.PI); ctx.moveTo(x - 7, y); ctx.lineTo(x - 4, y); ctx.moveTo(x + 4, y); ctx.lineTo(x + 7, y); }
    else ctx.rect(x - 5, y - 5, 10, 10);
    ctx.stroke(); ctx.setLineDash([]);
    if (vue.fov < 120 || o.mag < 4.5) { ctx.fillStyle = 'rgba(255,170,220,.85)'; ctx.font = '11px system-ui, sans-serif'; ctx.fillText(o.id, x + 8, y + 6); }
  }

  function dessinerSoleil(x, y) {
    const r = Math.max(9, 0.267 * RAD * S);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 6);
    g.addColorStop(0, 'rgba(255,250,220,1)'); g.addColorStop(0.18, 'rgba(255,230,150,.9)'); g.addColorStop(0.4, 'rgba(255,200,100,.25)'); g.addColorStop(1, 'rgba(255,180,80,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 6, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#fff6d8'; ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fill();
  }

  function dessinerLune(a, h, hSol, x, y) {
    const r = Math.max(10, 0.26 * RAD * S);
    // direction du Soleil sur l'écran : petit pas depuis la Lune vers le Soleil
    const d = h[0] * hSol[0] + h[1] * hSol[1] + h[2] * hSol[2];
    const p = [h[0] + 0.02 * (hSol[0] - d * h[0]), h[1] + 0.02 * (hSol[1] - d * h[1]), h[2] + 0.02 * (hSol[2] - d * h[2])];
    projH(p[0], p[1], p[2]);
    const ang = Math.atan2(P.y - y, P.x - x);
    const i = (180 - a.elongation) * RAD; // angle de phase
    const g = ctx.createRadialGradient(x, y, r, x, y, r * 3.5);
    g.addColorStop(0, `rgba(230,235,255,${0.25 * a.eclairement})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3.5, 0, 2 * Math.PI); ctx.fill();
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.fillStyle = 'rgba(40,44,60,.92)'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#f2efe4'; ctx.beginPath(); ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);
    for (let k = 20; k >= -20; k--) { const yy = r * k / 20; ctx.lineTo(-Math.cos(i) * Math.sqrt(Math.max(0, r * r - yy * yy)), yy); }
    ctx.closePath(); ctx.fill();
    // quelques mers lunaires pour le réalisme
    ctx.globalCompositeOperation = 'source-atop'; ctx.fillStyle = 'rgba(120,120,130,.28)';
    for (const [mx, my, mr] of [[-.25, -.3, .28], [.2, -.15, .22], [.05, .25, .2], [-.35, .2, .15]]) { ctx.beginPath(); ctx.arc(mx * r, my * r, mr * r, 0, 2 * Math.PI); ctx.fill(); }
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
  }

  function dessinerPlanete(a, x, y, nuit) {
    const tailleReelle = 2 * a.rayon / (a.distUA * 1.496e8) * S; // diamètre apparent en pixels
    const r = Math.max(2.4 + Math.max(0, 2 - a.mag) * 0.9, tailleReelle / 2);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
    g.addColorStop(0, a.couleur); g.addColorStop(0.3, a.couleur + '55'); g.addColorStop(1, a.couleur + '00');
    ctx.globalAlpha = 0.5 + nuit * 0.5; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 4, 0, 2 * Math.PI); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = a.couleur; ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fill();
    if (a.id === 'saturne' && r > 3) { ctx.strokeStyle = '#e8d7a0'; ctx.lineWidth = Math.max(1, r * 0.25); ctx.beginPath(); ctx.ellipse(x, y, r * 2.2, r * 0.7, -0.4, 0, 2 * Math.PI); ctx.stroke(); }
  }

  function dessinerSol(hSol) {
    const pts = [];
    for (let a = 0; a <= 360; a += 2) { const ar = a * RAD; projH(Math.cos(ar), Math.sin(ar), 0); pts.push([Math.max(-1e5, Math.min(1e5, P.x)), Math.max(-1e5, Math.min(1e5, P.y)), P.z]); }
    ctx.beginPath(); pts.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
    if (opt.sol) {
      const jour = Math.max(0, Math.min(1, (soleilAlt + 8) / 14));
      ctx.fillStyle = `rgba(${Math.round(8 + 40 * jour)},${Math.round(14 + 50 * jour)},${Math.round(12 + 26 * jour)},.97)`;
      const centreSol = vue.alt < 0, dedans = ctx.isPointInPath(cx, cy);
      if (centreSol === dedans) ctx.fill();
      else { ctx.save(); ctx.beginPath(); ctx.rect(-10, -10, W + 20, H + 20); pts.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill('evenodd'); ctx.restore(); }
    }
    ctx.strokeStyle = opt.sol ? 'rgba(140,190,150,.7)' : 'rgba(140,190,150,.5)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); let prec = null;
    for (const [x, y, z] of pts) { if (z > -0.7 && prec && Math.abs(x - prec[0]) < W) ctx.lineTo(x, y); else ctx.moveTo(x, y); prec = z > -0.7 ? [x, y] : null; }
    ctx.stroke();
    ctx.font = '700 15px system-ui, sans-serif'; ctx.textAlign = 'center';
    for (const [nom, az] of [['N', 0], ['NE', 45], ['E', 90], ['SE', 135], ['S', 180], ['SO', 225], ['O', 270], ['NO', 315]]) {
      if (projH(Math.cos(az * RAD), Math.sin(az * RAD), 0) && P.z > -0.5) { ctx.fillStyle = nom.length === 1 ? '#ffb27a' : 'rgba(255,178,122,.6)'; ctx.fillText(nom, P.x, P.y + 16); }
    }
    ctx.textAlign = 'left';
  }

  // --- Positions et objets ---
  function objetPosition(o) {
    let h;
    if (o.type === 'etoile') h = versH([vecE[o.i * 3], vecE[o.i * 3 + 1], vecE[o.i * 3 + 2]]);
    else if (o.type === 'messier') h = versH(o.o.v);
    else if (o.type === 'constellation') h = versH(o.c.v);
    else { const a = mobiles.find(m => m.id === o.id); if (!a) return null; h = a.h || versH(a.eq); }
    if (!h) return null;
    return { h, alt: Math.asin(Math.max(-1, Math.min(1, h[2]))) * DEG, az: Astro.norm360(Math.atan2(h[1], h[0]) * DEG) };
  }
  const vecteurObjet = o => o.type === 'etoile' ? [vecE[o.i * 3], vecE[o.i * 3 + 1], vecE[o.i * 3 + 2]] : o.type === 'messier' ? o.o.v : o.type === 'constellation' ? o.c.v : null;

  // Catalogue de recherche
  let catalogue = null;
  function construireCatalogue() {
    catalogue = [
      { cle: 'soleil', nom: 'Soleil', detail: 'notre étoile', type: 'soleil', id: 'soleil' },
      { cle: 'lune', nom: 'Lune', detail: 'notre satellite', type: 'lune', id: 'lune' },
      ...Astro.PLANETES.map(p => ({ cle: sansAccents(p.nom), nom: p.nom, detail: 'planète', type: 'planete', id: p.id })),
      ...messier.map(o => ({ cle: sansAccents(`${o.id} ${o.nom} ${o.ngc} ${o.alt}`), nom: `${o.id} – ${o.nom}`, detail: TYPES[o.type] || '', type: 'messier', id: o.id, o })),
      ...constels.map(c => ({ cle: sansAccents(`${c.fr} ${c.la} ${c.id}`), nom: c.fr, detail: `constellation (${c.la})`, type: 'constellation', id: c.id, c })),
      ...D.nomsEtoiles.filter(n => n[1]).map(([i, nom, , c]) => ({ cle: sansAccents(`${nom} ${NOMS_FR[nom] || ''}`), nom: NOMS_FR[nom] || nom, detail: `étoile, ${constelParId[c] ? constelParId[c].fr : c}`, type: 'etoile', id: 'e' + i, i }))
    ];
  }
  function chercher(texte, max = 12) {
    if (!catalogue) construireCatalogue();
    const t = sansAccents(texte.trim());
    if (!t) return [];
    const res = [];
    for (const c of catalogue) {
      const p = c.cle.indexOf(t);
      if (p === -1) continue;
      res.push([p === 0 ? 0 : c.cle.includes(' ' + t) ? 1 : 2, c]);
    }
    return res.sort((a, b) => a[0] - b[0]).slice(0, max).map(r => r[1]);
  }
  const objetDepuisCatalogue = c => c.type === 'etoile' ? { type: 'etoile', i: c.i, id: c.id } : c.type === 'messier' ? { type: 'messier', o: c.o, id: c.id } : c.type === 'constellation' ? { type: 'constellation', c: c.c, id: c.id } : { type: c.type, id: c.id };

  // --- Fiche d'information ---
  function leverCoucherTexte(fnVec, seuil) {
    const jd0 = jdCourant - 1 / 12;
    const r = Astro.leverCoucher(fnVec, jd0, Lieu.courant.lat, Lieu.courant.lon, seuil);
    if (r.lever === null && r.coucher === null) return r.max > seuil ? 'toujours au-dessus de l’horizon ici (circumpolaire)' : 'ne se lève pas ici aujourd’hui';
    const f = jd => jd === null ? '—' : heure(Astro.jdVersDate(jd));
    return `lever ${f(r.lever)} · coucher ${f(r.coucher)} · plus haut ${Math.round(r.max)}° à ${f(r.jdMax)}`;
  }

  function afficherFiche(o) {
    const fiche = $('#fiche-astre');
    const pos = objetPosition(o);
    let titre = '', lignes = [], texte = '', requeteNasa = null, cleSavoir = null;
    const visible = pos && pos.alt > 0;
    const posTexte = pos ? `${Math.round(pos.alt)}° de hauteur, vers ${cardinal(pos.az)} (${Math.round(pos.az)}°)` : '—';
    if (o.type === 'etoile') {
      const n = nomEtoile.get(o.i) || {}, mag = magE[o.i], ra = D.etoiles[o.i * 4] / 100, dec = D.etoiles[o.i * 4 + 1] / 100;
      titre = nomAffiche(o.i) || `Étoile de magnitude ${nombre(mag, 1)}`;
      const c = constelParId[n.c];
      lignes = [['Constellation', c ? c.fr : '—'], ['Éclat (magnitude)', nombre(mag, 2)], ['Couleur, température', `${descriptionCouleur(tempE[o.i])}, environ ${nombre(Math.round(tempE[o.i] / 100) * 100)} °C`],
        ['Distance', DIST_AL[n.nom] ? `${nombre(DIST_AL[n.nom], DIST_AL[n.nom] < 10 ? 1 : 0)} années-lumière` : 'non renseignée ici'],
        ['Lumière partie en', DIST_AL[n.nom] ? anneeDepart(DIST_AL[n.nom]) : '—'], ['Position', posTexte], ['Coordonnées', `AD ${raHeures(ra)}, Déc ${decDegres(dec)}`],
        ['Aujourd’hui', leverCoucherTexte(() => vecteurObjet(o), -0.5)]];
      requeteNasa = n.nom ? `${n.nom} star` : null; cleSavoir = n.nom;
    } else if (o.type === 'messier') {
      const m = o.o;
      titre = `${m.id} – ${m.nom}`;
      lignes = [['Type', TYPES[m.type] || m.type], ['Catalogue', m.ngc], ['Éclat (magnitude)', nombre(m.mag, 1)], ['Taille apparente', `${m.dim.replace('x', ' × ')} minutes d’arc`],
        ['Distance', MESSIER_DIST[m.id] ? formatAL(MESSIER_DIST[m.id]) : 'non renseignée ici'], ['Pour le voir', m.mag < 4.5 ? 'à l’œil nu sous un ciel noir' : m.mag < 7 ? 'aux jumelles' : 'avec un petit télescope'],
        ['Position', posTexte], ['Aujourd’hui', leverCoucherTexte(() => m.v, 0)]];
      requeteNasa = `${m.id} ${m.alt || ''}`.trim(); cleSavoir = m.id;
    } else if (o.type === 'constellation') {
      const c = o.c;
      titre = c.fr; lignes = [['Nom latin', c.la], ['Abréviation', c.id], ['Position du centre', posTexte], ['Aujourd’hui', leverCoucherTexte(() => c.v, 0)]];
      requeteNasa = `${c.la} constellation`; cleSavoir = c.fr;
    } else {
      const a = mobiles.find(m => m.id === o.id);
      titre = a.nom;
      const fnVec = jd => Astro.astresMobiles(jd).find(m => m.id === a.id).eq;
      if (a.type === 'soleil') {
        lignes = [['Hauteur', posTexte], ['Distance', `${nombre(a.distUA * 149.6, 1)} millions de km (${nombre(a.distUA * 8.317, 1)} minutes-lumière)`], ['Aujourd’hui', leverCoucherTexte(fnVec, -0.833)]];
        texte = '<p><b>⚠️ Ne regarde jamais le Soleil directement, ni aux jumelles ni au télescope, sans filtre solaire certifié : c’est la cécité assurée.</b></p>';
        requeteNasa = 'solar dynamics observatory sun'; cleSavoir = 'Soleil';
      } else if (a.type === 'lune') {
        const L = Astro.infosLune(jdCourant);
        lignes = [['Phase', `${L.nom}, éclairée à ${Math.round(L.eclairement * 100)} %`], ['Âge', `${nombre(L.age, 1)} jours depuis la nouvelle Lune`], ['Distance', `${nombre(L.distKm)} km (${nombre(L.distKm / 299792, 2)} s-lumière)`], ['Position', posTexte], ['Aujourd’hui', leverCoucherTexte(fnVec, 0.125)]];
        requeteNasa = 'moon lunar reconnaissance orbiter'; cleSavoir = 'Lune';
      } else {
        lignes = [['Éclat (magnitude)', nombre(a.mag, 1)], ['Distance à la Terre', `${nombre(a.distUA, 2)} UA = ${nombre(a.distUA * 149.6)} millions de km`], ['La lumière met', dureeLumiere(a.distUA * 499.005)],
          ['Diamètre apparent', `${nombre(2 * a.rayon / (a.distUA * 1.496e8) * DEG * 3600, 1)} secondes d’arc`], ['Position', posTexte], ['Aujourd’hui', leverCoucherTexte(fnVec, 0)]];
        requeteNasa = { mercure: 'Mercury MESSENGER', venus: 'Venus', mars: 'Mars Perseverance', jupiter: 'Jupiter Juno', saturne: 'Saturn Cassini', uranus: 'Uranus', neptune: 'Neptune Voyager' }[a.id];
        cleSavoir = a.nom;
      }
    }
    fiche.innerHTML = `<button class="fermer" aria-label="Fermer">×</button><h3>${echap(titre)}</h3>
      <div class="pastille">${visible ? '✅ au-dessus de l’horizon' : '🌍 sous l’horizon en ce moment'}</div>
      <table>${lignes.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table>${texte}
      <div class="ligne">
        <button class="btn petit" data-act="centrer">🎯 Centrer</button>
        <button class="btn petit" data-act="suivre" aria-pressed="${suivi && suivi.id === o.id}">📌 Suivre</button>
        ${requeteNasa ? '<button class="btn petit" data-act="nasa">📷 Photos NASA</button>' : ''}
        ${cleSavoir && Savoir.trouverFiche(cleSavoir) ? '<button class="btn petit" data-act="fiche">📚 Fiche</button>' : ''}
      </div>`;
    fiche.hidden = false;
    fiche.querySelector('.fermer').onclick = () => { fiche.hidden = true; selection = null; suivi = null; sale = true; };
    fiche.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
      const act = b.dataset.act;
      if (act === 'centrer') centrer(o);
      if (act === 'suivre') { suivi = suivi && suivi.id === o.id ? null : o; b.setAttribute('aria-pressed', !!suivi); sale = true; }
      if (act === 'nasa') Appli.ouvrirMedias(requeteNasa);
      if (act === 'fiche') Appli.ouvrirFiche(Savoir.trouverFiche(cleSavoir).id);
    });
    Bus.emettre('selection', { titre, type: o.type });

    choisirScene('voisinage');
    const boucle = t => {
